name: Fix immersive build

on:
  push:
    branches: [immersive-patch-v015]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: immersive-patch-v015
          fetch-depth: 0
      - name: Fix duplicate import
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          duplicate = 'import { InteractiveMap } from "./components/InteractiveMap";\nimport { InteractiveMap } from "./components/InteractiveMap";\n'
          if duplicate not in text:
              raise SystemExit('Expected duplicate import not found')
          path.write_text(text.replace(duplicate, 'import { InteractiveMap } from "./components/InteractiveMap";\n', 1), encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Fix duplicate interactive map import"
          git push origin immersive-patch-v015
