name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble and verify Kitaba Companion source
        shell: pwsh
        run: |
          $partNames = @(
            'part00.txt','part01.txt','part02.txt','part03.txt','part04.txt','part05.txt','part06.txt',
            'part07a.txt','part07b.txt','part07c.txt','part07d.txt',
            'part08.txt','part09.txt','part10.txt','part11.txt','part12.txt','part13.txt','part14.txt','part15.txt',
            'part16a.txt','part16b1.txt','part16b2.txt','part16b3.txt','part16c.txt','part16d.txt',
            'part17a.txt','part17b.txt','part17c.txt','part17d.txt',
            'part18.txt','part19.txt','part20.txt','part21.txt','part22.txt','part23.txt','part24.txt'
          )
          $parts = $partNames | ForEach-Object {
            $path = Join-Path 'source-b64-v3' $_
            if (-not (Test-Path $path)) { throw "Missing source chunk: $path" }
            $path
          }
          $base64 = ($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ''
          if ($base64.Length -ne 147180) { throw "Unexpected base64 length $($base64.Length); expected 147180." }
          $bytes = [Convert]::FromBase64String($base64)
          [IO.File]::WriteAllBytes('kitaba-companion-source-reassembled.zip', $bytes)
          $sha = (Get-FileHash 'kitaba-companion-source-reassembled.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '2ca6483e405a6035ebaffc2fa9f65b3d661e84d12d9d2c330b0da9745028dc78'
          if ($sha -ne $expected) { throw "Source archive checksum mismatch. Got $sha expected $expected." }
          New-Item -ItemType Directory -Force -Path app | Out-Null
          Expand-Archive -Path kitaba-companion-source-reassembled.zip -DestinationPath app -Force
          New-Item -ItemType Directory -Force -Path app/public | Out-Null
          Copy-Item -Path bootstrap/kitaba-world-map.png -Destination app/public/kitaba-world-map.png -Force
          if (-not (Test-Path app/public/kitaba-world-map.png)) { throw 'Default world map bootstrap failed.' }

      - name: Apply verified source fixes for 0.1.1
        shell: pwsh
        run: |
          $path = 'app/src-tauri/src/db.rs'
          $source = Get-Content $path -Raw
          $replacements = @(
            @(
              '        stmt.query_map(params![campaign_id, kind], |r| r.get(0))?.collect::<Result<Vec<String>, _>>()?',
              "        let rows = stmt.query_map(params![campaign_id, kind], |r| r.get(0))?.collect::<Result<Vec<String>, _>>()?;`r`n        rows"
            ),
            @(
              '        stmt.query_map([cid], |r| Ok((r.get(0)?, r.get(1)?, r.get(2)?)))?.collect::<Result<Vec<_>, _>>()?',
              "        let rows = stmt.query_map([cid], |r| Ok((r.get(0)?, r.get(1)?, r.get(2)?)))?.collect::<Result<Vec<_>, _>>()?;`r`n        rows"
            ),
            @(
              '        stmt.query_map([], |r| Ok((r.get(0)?, r.get(1)?, r.get(2)?)))?.collect::<Result<Vec<_>, _>>()?',
              "        let rows = stmt.query_map([], |r| Ok((r.get(0)?, r.get(1)?, r.get(2)?)))?.collect::<Result<Vec<_>, _>>()?;`r`n        rows"
            ),
            @(
              '        assert!(!player.contains("hidden"));',
              '        assert!(!player.contains("\"secret\": \"hidden\""));'
            ),
            @(
              '        assert!(full.contains("hidden"));',
              '        assert!(full.contains("\"secret\": \"hidden\""));'
            )
          )
          foreach ($pair in $replacements) {
            if (-not $source.Contains($pair[0])) { throw "Expected Rust source pattern not found: $($pair[0])" }
            $source = $source.Replace($pair[0], $pair[1])
          }
          Set-Content -Path $path -Value $source -NoNewline

          $mainPath = 'app/src-tauri/src/main.rs'
          $main = Get-Content $mainPath -Raw
          $subsystemAttr = '#![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]'
          if (-not $main.Contains($subsystemAttr)) {
            $main = "$subsystemAttr`r`n$main"
            Set-Content -Path $mainPath -Value $main -NoNewline
          }

          $sidebarPath = 'app/src/components/Sidebar.tsx'
          $sidebar = Get-Content $sidebarPath -Raw
          $oldPc = '  const pc = entities.find((e) => e.entity_type === "player_character")?.data ?? {};'
          $newPc = '  const pcEntity = entities.find((e) => e.entity_type === "player_character");' + [Environment]::NewLine + '  const pc = pcEntity?.data ?? {};'
          if (-not $sidebar.Contains($oldPc)) { throw 'Expected empty-state player-character pattern not found.' }
          $sidebar = $sidebar.Replace($oldPc, $newPc)
          $sidebar = $sidebar.Replace('  const firstName = text(pc, "first_name", "prenom", "name") ?? "Sully";', '  const firstName = text(pc, "first_name", "prenom", "name") ?? (campaign ? "Sully" : "—");')
          $sidebar = $sidebar.Replace('  const species = text(pc, "species", "espece") ?? "Humain";', '  const species = text(pc, "species", "espece");')
          $sidebar = $sidebar.Replace('  const age = text(pc, "age") ?? "8";', '  const age = text(pc, "age");')
          $oldIdentity = '        <span>{species} • {age} ans</span>'
          $newIdentity = '        <span>{species !== null || age !== null ? `${species ?? "Espèce non renseignée"}${age !== null ? ` • ${age} ans` : ""}` : "Personnage non initialisé"}</span>'
          if (-not $sidebar.Contains($oldIdentity)) { throw 'Expected sidebar identity pattern not found.' }
          $sidebar = $sidebar.Replace($oldIdentity, $newIdentity)
          if ($sidebar.Contains('?? "Humain"') -or $sidebar.Contains('text(pc, "age") ?? "8"')) { throw 'Hard-coded empty-state species/age still present.' }
          Set-Content -Path $sidebarPath -Value $sidebar -NoNewline

          $packagePath = 'app/package.json'
          $package = Get-Content $packagePath -Raw
          if (-not $package.Contains('"version": "0.1.0"')) { throw 'package.json version 0.1.0 not found.' }
          Set-Content -Path $packagePath -Value ($package.Replace('"version": "0.1.0"', '"version": "0.1.1"')) -NoNewline

          $cargoPath = 'app/src-tauri/Cargo.toml'
          $cargo = Get-Content $cargoPath -Raw
          if (-not $cargo.Contains('version = "0.1.0"')) { throw 'Cargo version 0.1.0 not found.' }
          Set-Content -Path $cargoPath -Value ($cargo.Replace('version = "0.1.0"', 'version = "0.1.1"')) -NoNewline

          $tauriPath = 'app/src-tauri/tauri.conf.json'
          $tauri = Get-Content $tauriPath -Raw
          if (-not $tauri.Contains('"version": "0.1.0"')) { throw 'Tauri version 0.1.0 not found.' }
          Set-Content -Path $tauriPath -Value ($tauri.Replace('"version": "0.1.0"', '"version": "0.1.1"')) -NoNewline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install reference-test dependencies
        working-directory: app
        run: python -m pip install -r requirements-test.txt

      - name: Run executable reference suite
        working-directory: app
        run: python -m pytest reference/tests -q

      - name: Install frontend dependencies
        working-directory: app
        run: npm install

      - name: Run frontend type/build checks
        working-directory: app
        run: npm run build

      - name: Run Rust tests/checks
        working-directory: app
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Windows installer
        working-directory: app
        run: npm run tauri build

      - name: Verify Windows GUI subsystem
        shell: pwsh
        run: |
          $exe = 'app/src-tauri/target/release/kitaba-companion.exe'
          if (-not (Test-Path $exe)) { throw 'Release executable missing.' }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne "PE`0`0") { throw 'Invalid PE signature.' }
          $optionalHeaderOffset = $peOffset + 24
          $subsystem = [BitConverter]::ToUInt16($bytes, $optionalHeaderOffset + 68)
          if ($subsystem -ne 2) { throw "Release executable is not a Windows GUI application. PE subsystem=$subsystem" }
          Write-Host 'PE subsystem 2 confirmed: Windows GUI, no console dependency.'

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: kitaba-companion-windows-0.1.1
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/kitaba-companion.exe
          if-no-files-found: error
