name: Apply Character Creation v0.1.4

on:
  push:
    branches: [character-creation-v014]
    paths:
      - scripts/add_new_campaign_button_v014.py
      - .github/workflows/apply-character-creation-v014.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Apply new-campaign UX patch
        run: python scripts/add_new_campaign_button_v014.py
      - name: Commit patched product
        shell: bash
        run: |
          git config user.name "kitaba-ci"
          git config user.email "kitaba-ci@users.noreply.github.com"
          git add src reference CHANGELOG.md
          git commit -m "Allow independent campaign creation from active campaign"
          git push origin character-creation-v014
