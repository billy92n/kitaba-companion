name: Apply Character Creation v0.1.4

on:
  push:
    branches: [character-creation-v014]
    paths:
      - scripts/apply_character_creation_v014.py
      - .github/workflows/apply-character-creation-v014.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Apply onboarding patch
        run: python scripts/apply_character_creation_v014.py
      - name: Refresh npm lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Refresh Cargo lock metadata
        run: cargo update --manifest-path src-tauri/Cargo.toml -p kitaba-companion
      - name: Keep permanent workflow unchanged on this branch
        run: git checkout -- .github/workflows/build-windows.yml
      - name: Commit patched product
        shell: bash
        run: |
          git config user.name "kitaba-ci"
          git config user.email "kitaba-ci@users.noreply.github.com"
          git add src src-tauri reference package.json package-lock.json README.md docs/STATUS.md CHANGELOG.md
          git commit -m "Add fresh character creation onboarding (0.1.4)"
          git push origin character-creation-v014
