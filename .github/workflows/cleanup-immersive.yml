name: Cleanup immersive patch

on:
  push:
    branches: [immersive-patch-v015]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: immersive-patch-v015
          fetch-depth: 0
      - name: Normalize changelog and Cargo lock
        shell: python
        run: |
          from pathlib import Path
          import re

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          heading = '## 0.1.5 — Immersion & interaction\n\n'
          first = text.find(heading)
          second = text.find(heading, first + len(heading)) if first >= 0 else -1
          if second >= 0:
              next_heading = text.find('\n## ', second + len(heading))
              if next_heading < 0:
                  raise SystemExit('Cannot locate end of duplicate changelog section')
              text = text[:second] + text[next_heading + 1:]
              changelog.write_text(text, encoding='utf-8')

          lock = Path('src-tauri/Cargo.lock')
          lock_text = lock.read_text(encoding='utf-8')
          lock_text, count = re.subn(
              r'(\[\[package\]\]\nname = "kitaba-companion"\nversion = ")0\.1\.4(")',
              r'\g<1>0.1.5\2',
              lock_text,
              count=1,
          )
          if count:
              lock.write_text(lock_text, encoding='utf-8')
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md src-tauri/Cargo.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Normalize immersive release metadata"
          git push origin immersive-patch-v015
