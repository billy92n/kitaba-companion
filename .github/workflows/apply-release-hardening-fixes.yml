name: Apply final 0.1.6 hardening fixes

on:
  push:
    branches: [next-system-pass]
    paths:
      - .github/workflows/apply-release-hardening-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: next-system-pass
          fetch-depth: 0
      - name: Apply targeted hardening fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          map_file = Path("src/components/InteractiveMap.tsx")
          text = map_file.read_text(encoding="utf-8")
          old = 'if (!drag || drag.pointerId !== event.pointerId || zoom <= minimumZoom) return;'
          new = 'if (!drag || drag.pointerId !== event.pointerId) return;'
          if old not in text:
              raise SystemExit("expected map drag guard not found")
          map_file.write_text(text.replace(old, new, 1), encoding="utf-8")

          backlog = Path("docs/NEXT_SYSTEM_PASS_BACKLOG.md")
          text = backlog.read_text(encoding="utf-8")
          old = "No item moves to stable merely parce qu'il existe on this branch."
          new = "No item moves to stable merely because it exists on this branch."
          if old not in text:
              raise SystemExit("expected backlog wording not found")
          backlog.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/InteractiveMap.tsx docs/NEXT_SYSTEM_PASS_BACKLOG.md
          git commit -m "Polish final 0.1.6 release hardening"
          git push origin HEAD:next-system-pass
