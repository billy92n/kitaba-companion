name: Immersive Patch CI

on:
  push:
    branches: [immersive-patch-v015]

concurrency:
  group: immersive-patch-ci
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install reference-test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run executable reference suite
        run: python -m pytest reference/tests -q
      - name: Install frontend dependencies reproducibly
        run: npm ci
      - name: Run frontend type/build checks
        run: npm run build
      - name: Run Rust tests/checks
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Tauri Windows installer
        run: npm run tauri build
      - name: Verify Windows GUI subsystem
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/kitaba-companion.exe'
          if (-not (Test-Path $exe)) { throw 'Release executable missing.' }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne "PE`0`0") { throw 'Invalid PE signature.' }
          $optionalHeaderOffset = $peOffset + 24
          $subsystem = [BitConverter]::ToUInt16($bytes, $optionalHeaderOffset + 68)
          if ($subsystem -ne 2) { throw "Release executable is not a Windows GUI application. PE subsystem=$subsystem" }
      - name: Upload Windows bundles
        uses: actions/upload-artifact@v7
        with:
          name: kitaba-companion-windows-0.1.5-candidate
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/kitaba-companion.exe
          if-no-files-found: error
