name: Patch 0.1.5 resolution rules

on:
  push:
    branches: [immersive-patch-v015]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: immersive-patch-v015
          fetch-depth: 0
      - name: Patch resolution and terse-action rules
        run: python scripts/patch_resolution_v015.py
      - name: Commit rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/db.rs reference/engine.py reference/tests/test_immersive_patch.py CHANGELOG.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enforce GM resolution and enrich terse player actions"
          git push origin immersive-patch-v015
