name: Patch 0.1.5 hidden roll rule

on:
  push:
    branches: [immersive-patch-v015]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: immersive-patch-v015
          fetch-depth: 0
      - name: Apply hidden roll contract patch
        run: python scripts/patch_hidden_roll_v015.py
      - name: Commit contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/db.rs reference/engine.py reference/tests/test_immersive_patch.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use hidden dice-like resolution for uncertain actions"
          git push origin immersive-patch-v015
