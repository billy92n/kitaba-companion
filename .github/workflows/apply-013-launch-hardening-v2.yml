name: Apply 0.1.3 Launch Hardening v2

on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-013-launch-hardening-v2.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/run_013_patch.py
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Refresh npm lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "kitaba-ci"
          git config user.email "kitaba-ci@users.noreply.github.com"
          git add src reference package.json package-lock.json src-tauri README.md docs/STATUS.md CHANGELOG.md
          git commit -m "Harden Kitaba for first campaign launch (0.1.3)"
          git push origin main
